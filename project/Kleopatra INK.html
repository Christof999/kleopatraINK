  <script>
    // Suppress the benign "ResizeObserver loop completed" warning early.
    // Fires when observer callbacks cause layout; harmless per spec.
    (function(){
      // Root-cause fix: wrap every ResizeObserver callback in rAF so it
      // cannot synchronously mutate layout during the observation loop.
      if (typeof window.ResizeObserver !== 'undefined') {
        const Original = window.ResizeObserver;
        window.ResizeObserver = class extends Original {
          constructor(cb){
            let raf = 0;
            super((entries, observer) => {
              cancelAnimationFrame(raf);
              raf = requestAnimationFrame(() => {
                try { cb(entries, observer); } catch(e) {}
              });
            });
          }
        };
      }
      const MSG = 'ResizeObserver loop';
      const prevOnError = window.onerror;
      window.onerror = function(message, ...rest){
        if (typeof message === 'string' && message.indexOf(MSG) !== -1) return true;
        if (prevOnError) return prevOnError.call(this, message, ...rest);
        return false;
      };
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).indexOf(MSG) !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      }, true);
      const origErr = window.console.error;
      window.console.error = function(...args){
        const s = args && args[0];
        if (typeof s === 'string' && s.indexOf(MSG) !== -1) return;
        return origErr.apply(this, args);
      };
    })();
  </script>
